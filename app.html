<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <script src="app.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
     <div class="h-screen w-full flex flex-col  items-center ">

                <td class="border px-4 py-1.5">Not</td>

                <td class="border px-4 py-1.5">Not</td>
            </tr>
            <tr>
                <td class="border px-4 py-1.5">Ding homework</td>
                <td class="border px-4 py-1.5">9:00</td>
                <td class="border px-4 py-1.5">Not</td>
            </tr>
            <tr>
                <td class="border px-4  py-1.5">Dancing</td>
                <td class="border px-4 py-1.5">1:00</td>
                <td class="border px-4 py-1.5">Not</td>

</html>
